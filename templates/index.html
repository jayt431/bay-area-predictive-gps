<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bay Area Predictive GPS</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    :root {
      --bg: #0A0A0B; --ink: #E8E8E8; --muted: #888; --line: #2a2a2e;
      --panel: rgba(16,16,20,0.72); --accent: #00E5C7;
      --red: #FF3B30; --yellow: #FFB020; --green: #3DD68C; --meter: #A78BFA; --garage: #4F8EF7;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { height: 100%; width: 100%; }
    body { background: var(--bg); font-family: var(--sans); color: var(--ink); overflow: hidden; }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .mono-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ---- Search panel (bottom-left) ---- */
    #search-panel { position: absolute; z-index: 3; left: 20px; bottom: 20px; width: 340px; padding: 18px; }
    #search-panel .mono-label { margin-bottom: 8px; display: block; }
    .search-wrap { position: relative; }
    #search-input {
      width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px; color: var(--ink);
      font-size: 15px; font-family: var(--sans); outline: none; transition: border-color 0.15s;
    }
    #search-input::placeholder { color: #666; }
    #search-input:focus { border-color: var(--accent); }

    /* Geocoding suggestions dropdown (opens upward, above the input) */
    #suggestions {
      position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
      display: none; max-height: 260px; overflow-y: auto; padding: 6px;
    }
    #suggestions.open { display: block; }
    .sugg-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
    .sugg-item:hover, .sugg-item.hi { background: rgba(255,255,255,0.06); }
    .sugg-name { font-size: 14px; color: var(--ink); }
    .sugg-sub  { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

    .quick-title { margin: 16px 0 8px; }
    .quick-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .quick-chip {
      font-size: 12px; padding: 7px 12px; border-radius: 20px; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--ink);
      transition: background 0.12s, border-color 0.12s;
    }
    .quick-chip:hover { background: rgba(0,229,199,0.10); border-color: var(--accent); }

    /* Saved destinations */
    .saved-chip {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; padding: 7px 10px 7px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--ink);
      transition: border-color 0.12s;
    }
    .saved-chip:hover { border-color: var(--accent); }
    .saved-chip > .go { cursor: pointer; }
    .saved-chip > .x { cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }
    .saved-chip > .x:hover { color: var(--red); }

    /* Star toggle in the route summary */
    .rs-head { display: flex; justify-content: space-between; align-items: center; }
    .star-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 2px; display: flex; }
    .star-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .star-btn.on { color: var(--accent); }
    .star-btn.on svg { fill: var(--accent); stroke: var(--accent); }

    /* ---- Route summary (top-left) ---- */
    #route-summary { position: absolute; z-index: 3; top: 20px; left: 20px; width: 300px; padding: 16px 18px; display: none; }
    #route-summary.open { display: block; }
    .rs-dest { font-size: 16px; font-weight: 600; margin: 6px 0 12px; line-height: 1.3; }
    .rs-stats { display: flex; gap: 24px; }
    .rs-stat .num { font-size: 22px; font-weight: 700; font-family: var(--mono); }
    .rs-stat .num small { font-size: 12px; color: var(--muted); font-weight: 400; }
    .rs-stat .cap { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .rs-stat .num.warn { color: var(--yellow); }
    .rs-stat .num.danger { color: var(--red); }

    /* AI trip brief */
    #brief { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: none; }
    #brief.open { display: block; }
    .brief-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .brief-risk { font-size: 10px; font-weight: 700; font-family: var(--mono); letter-spacing: 0.08em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
    .brief-risk.none   { background: rgba(61,214,140,0.15); color: var(--green); }
    .brief-risk.low    { background: rgba(255,176,32,0.15); color: var(--yellow); }
    .brief-risk.medium { background: rgba(255,176,32,0.20); color: var(--yellow); }
    .brief-risk.high   { background: rgba(255,59,48,0.15);  color: var(--red); }
    .brief-src { font-size: 9px; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .brief-headline { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; }
    .brief-rec { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .brief-rec b { color: var(--accent); font-weight: 600; }
    .brief-loading { font-size: 12px; color: var(--muted); font-family: var(--mono); }

    /* ---- Notification bell (top-right) ---- */
    #bell {
      position: absolute; z-index: 3; top: 20px; right: 20px;
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    }
    #bell svg { width: 20px; height: 20px; }
    #bell-badge {
      position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
      font-family: var(--mono); display: none; align-items: center; justify-content: center; border: 2px solid var(--bg);
    }

    /* ---- Alert panel (top-right, under bell) ---- */
    #alert-panel { position: absolute; z-index: 3; top: 76px; right: 20px; width: 330px; padding: 8px; display: none; }
    #alert-panel.open { display: block; }
    .alert-panel-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 12px; border-bottom: 1px solid var(--line); }
    .alert-item { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .alert-item:last-child { border-bottom: none; }
    .alert-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .alert-dot.red    { background: var(--red);    box-shadow: 0 0 8px 1px rgba(255,59,48,0.6); }
    .alert-dot.yellow { background: var(--yellow); box-shadow: 0 0 8px 1px rgba(255,176,32,0.5); }
    .alert-name { font-size: 14px; color: var(--ink); margin-bottom: 3px; }
    .alert-reason { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .alert-empty { padding: 20px 12px; color: var(--muted); font-size: 13px; text-align: center; }

    /* ---- Area feed (View 2: what's happening nearby) ---- */
    #nearby-btn { position: absolute; z-index: 3; top: 20px; right: 78px; height: 46px; padding: 0 16px;
      border-radius: 23px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink);
      font-family: var(--sans); font-size: 13px; font-weight: 600; }
    #nearby-btn:hover { border-color: var(--accent); }
    #feed-panel { position: absolute; z-index: 4; top: 76px; right: 20px; width: 340px; padding: 8px;
      max-height: calc(100vh - 100px); overflow-y: auto; display: none; }
    #feed-panel.open { display: block; }
    .feed-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); }
    .feed-place { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 3px; }
    .feed-item { display: flex; gap: 11px; padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .feed-item:last-child { border-bottom: none; }
    .feed-icon { font-size: 17px; line-height: 1.2; flex-shrink: 0; }
    .feed-name { font-size: 13px; color: var(--ink); }
    .feed-name .sev { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
    .feed-name .sev.red { background: var(--red); } .feed-name .sev.yellow { background: var(--yellow); }
    .feed-meta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    .feed-addr { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ---- Parking panel (bottom-right) ---- */
    #parking-panel { position: absolute; z-index: 3; right: 20px; bottom: 20px; width: 300px; padding: 8px; display: none; }
    #parking-panel.open { display: block; }
    .pp-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 12px; border-bottom: 1px solid var(--line); }
    .pp-btn { background: none; border: 1px solid var(--line); color: var(--accent); font-family: var(--mono);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
    .pp-btn:hover { border-color: var(--accent); }
    .pk-item { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .pk-item:last-child { border-bottom: none; }
    .pk-badge { flex-shrink: 0; align-self: flex-start; font-size: 10px; font-weight: 700; font-family: var(--mono);
      letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; }
    .pk-badge.easy     { background: rgba(61,214,140,0.15); color: var(--green); }
    .pk-badge.moderate { background: rgba(255,176,32,0.15); color: var(--yellow); }
    .pk-badge.hard     { background: rgba(255,59,48,0.15);  color: var(--red); }
    .pk-badge.metered  { background: rgba(167,139,250,0.15); color: var(--meter); }
    .pk-badge.garage   { background: rgba(79,142,247,0.15);  color: var(--garage); }
    .pk-name { font-size: 14px; color: var(--ink); margin-bottom: 3px; }
    .pk-caution { font-size: 11px; color: var(--red); font-family: var(--mono); }
    .pk-sub { font-size: 12px; color: var(--muted); }
    .pk-meta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }

    /* ---- Trip mode (committed route) ---- */
    .rs-start { margin-top: 14px; width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: var(--accent); color: #05221e; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans); }
    .rs-start:hover { filter: brightness(1.08); }
    body.trip-mode #search-panel,
    body.trip-mode #route-summary,
    body.trip-mode #parking-panel,
    body.trip-mode #alert-panel,
    body.trip-mode #bell { display: none !important; }
    #trip-panel { position: absolute; z-index: 4; top: 20px; left: 20px; bottom: 20px; width: 360px;
      display: none; flex-direction: column; overflow: hidden; }
    body.trip-mode #trip-panel { display: flex; }
    .trip-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    #trip-eta { color: var(--accent); font-size: 18px; font-weight: 700; font-family: var(--mono); }
    #trip-dist { color: var(--muted); font-family: var(--mono); font-size: 13px; }
    .trip-next { padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }
    #trip-body { overflow-y: auto; }
    .trip-sec-title { padding: 14px 18px 6px; display: block; }
    .step-item { display: flex; gap: 10px; justify-content: space-between; padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; color: var(--ink); }
    .step-dist { color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: nowrap; }

    /* Navigation banner (step-through) */
    .nav-banner { padding: 16px 18px; border-bottom: 1px solid var(--line); background: rgba(0,229,199,0.06); }
    .nav-instruction { font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ink); }
    .nav-sub { margin-top: 6px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .nav-sub .warn { color: var(--yellow); } .nav-sub .danger { color: var(--red); }
    .nav-controls { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
      background: rgba(255,255,255,0.05); color: var(--ink); font-family: var(--sans); font-size: 14px; font-weight: 600; }
    .nav-btn.primary { background: var(--accent); color: #05221e; border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .nav-btn:not(:disabled):hover { border-color: var(--accent); }
    .step-item.current { background: rgba(0,229,199,0.12); border-left: 3px solid var(--accent); }
    .sim-tag { position: absolute; z-index: 4; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 6px 14px; border-radius: 20px; display: none; }
    body.trip-mode .sim-tag { display: block; }
    #recenter-btn { position: absolute; z-index: 5; right: 20px; bottom: 60px; display: none;
      align-items: center; gap: 8px; padding: 10px 16px; border-radius: 22px; cursor: pointer;
      background: var(--accent); color: #05221e; border: none; font-family: var(--sans); font-size: 14px; font-weight: 700; }
    #recenter-btn svg { width: 16px; height: 16px; }

    .mapboxgl-popup-content { background: #16161a; color: var(--ink); border: 1px solid #333; border-radius: 8px; font-size: 13px; padding: 10px 12px; font-family: var(--mono); }
    .mapboxgl-popup-content strong { color: #fff; }
    .mapboxgl-popup-tip { border-top-color: #16161a !important; }
    .mapboxgl-popup-close-button { color: var(--muted); }
    .mapboxgl-ctrl-bottom-right { display: none; }

    .no-token { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); text-align: center; padding: 40px; line-height: 1.6; }
    .no-token code { background: #222; padding: 2px 6px; border-radius: 4px; color: var(--accent); }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Route summary (top-left) -->
  <div id="route-summary" class="glass">
    <div class="rs-head">
      <span class="mono-label">Route</span>
      <button id="star-btn" class="star-btn" onclick="toggleSaveCurrent()" title="Save destination">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="rs-dest" id="rs-dest">—</div>
    <div class="rs-stats">
      <div class="rs-stat"><div class="num" id="rs-eta">—</div><div class="cap">ETA</div></div>
      <div class="rs-stat"><div class="num" id="rs-dist">—</div><div class="cap">Distance</div></div>
      <div class="rs-stat"><div class="num" id="rs-alerts">—</div><div class="cap">On route</div></div>
    </div>
    <div id="brief">
      <div class="brief-top">
        <span id="brief-risk" class="brief-risk"></span>
        <span id="brief-src" class="brief-src"></span>
      </div>
      <div id="brief-headline" class="brief-headline"></div>
      <div id="brief-rec" class="brief-rec"></div>
    </div>
    <button id="start-btn" class="rs-start" onclick="startTrip()">▶ Start trip</button>
  </div>

  <!-- Trip (active navigation) panel -->
  <div id="trip-panel" class="glass">
    <div class="trip-bar">
      <div><span id="trip-eta"></span><span id="trip-dist"></span></div>
      <button class="pp-btn" onclick="endTrip()">End trip</button>
    </div>
    <div class="nav-banner">
      <div id="nav-instruction" class="nav-instruction"></div>
      <div id="nav-sub" class="nav-sub"></div>
      <div class="nav-controls">
        <button id="nav-prev" class="nav-btn" onclick="stepBy(-1)">‹ Prev</button>
        <button id="nav-next" class="nav-btn" onclick="stepBy(1)">Next ›</button>
      </div>
      <div class="nav-controls">
        <button id="nav-drive" class="nav-btn primary" onclick="toggleDrive()">▶ Drive</button>
        <button id="nav-speed" class="nav-btn" onclick="cycleSpeed()" style="flex:0 0 70px">3×</button>
      </div>
    </div>
    <div id="trip-body"></div>
  </div>
  <div class="sim-tag">◉ Simulating drive</div>
  <button id="recenter-btn" onclick="recenter()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>Re-center</button>

  <!-- Area feed toggle (View 2) -->
  <div id="nearby-btn" class="glass" onclick="toggleFeed()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>
    </svg>Nearby
  </div>

  <!-- Area feed panel -->
  <div id="feed-panel" class="glass">
    <div class="feed-head">
      <span class="mono-label">Happening nearby</span>
      <div class="feed-place" id="feed-place">—</div>
    </div>
    <div id="feed-list"></div>
  </div>

  <!-- Notification bell -->
  <div id="bell" class="glass" onclick="toggleAlerts()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span id="bell-badge">0</span>
  </div>

  <!-- Alert panel -->
  <div id="alert-panel" class="glass">
    <div class="alert-panel-head">
      <span class="mono-label">Disruptions on route</span>
      <span class="mono-label" id="alert-count"></span>
    </div>
    <div id="alert-list"></div>
  </div>

  <!-- Parking panel -->
  <div id="parking-panel" class="glass">
    <div class="pp-head">
      <span class="mono-label">Parking near destination</span>
      <button class="pp-btn" id="pk-show" onclick="toggleParkingView()">Show on map ▸</button>
    </div>
    <div id="parking-list"></div>
  </div>

  <!-- Search panel -->
  <div id="search-panel" class="glass">
    <span class="mono-label">Destination</span>
    <div class="search-wrap">
      <input id="search-input" placeholder="Where to?" autocomplete="off" />
      <div id="suggestions" class="glass"></div>
    </div>
    <div id="saved-section" style="display:none">
      <div class="mono-label quick-title">Saved</div>
      <div class="quick-row" id="saved-row"></div>
    </div>
    <div class="mono-label quick-title">Suggested</div>
    <div class="quick-row" id="quick-row"></div>
  </div>

  <script>
    const TOKEN = "{{ mapbox_token }}";

    // Bay Area bounding box + center, to scope geocoding results
    const BAY_BBOX = "-122.65,37.20,-121.70,38.20";
    const BAY_PROX = "-122.42,37.77";

    // Distance thresholds (km) from the route line -> severity
    const NEAR_RED = 0.5;    // basically on your path
    const NEAR_YELLOW = 2.0; // close enough to spill over

    // A few one-tap destinations so you can demo without typing
    const QUICK = [
      { name: "Chase Center", lon: -122.3874, lat: 37.7680 },
      { name: "SFO Airport",  lon: -122.3790, lat: 37.6213 },
      { name: "Oracle Park",  lon: -122.3893, lat: 37.7786 },
      { name: "Downtown Berkeley", lon: -122.2680, lat: 37.8700 },
      { name: "Ferry Building", lon: -122.3934, lat: 37.7956 },
    ];

    let home = null;         // { label, lat, lon }
    let disruptions = [];    // full Bay Area pool
    let suggIndex = -1;      // keyboard-highlighted suggestion
    let currentDest = null;  // the destination currently routed to
    const SAVED_KEY = "bapg_saved";
    let saved = loadSaved(); // saved destinations, persisted in localStorage

    if (!TOKEN) {
      document.getElementById("map").innerHTML =
        '<div class="no-token">No Mapbox token found.<br>Add <code>MAPBOX_TOKEN=pk.your_token</code> to your .env, then restart.</div>';
    } else {
      boot();
    }

    async function boot() {
      // Load home base + disruption pool from our backend
      const [cfg, dis] = await Promise.all([
        fetch("/api/config").then(r => r.json()),
        fetch("/api/disruptions").then(r => r.json()),
      ]);
      home = cfg.home;
      disruptions = dis.disruptions || [];

      mapboxgl.accessToken = TOKEN;
      window.map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/dark-v11",
        center: [home.lon, home.lat],
        zoom: 12,
      });

      const SEVERITY_COLOR = ["match", ["get", "severity"], "red", "#FF3B30", "yellow", "#FFB020", "#888"];
      const AVAIL_COLOR = ["match", ["get", "availability"], "easy", "#3DD68C", "moderate", "#FFB020", "hard", "#FF3B30", "#888"];
      const zoomRadius = (s, b) => ["interpolate", ["linear"], ["zoom"], 10, s, 15, b];

      map.on("load", () => {
        // Empty sources; filled as the user routes (init once, update in place)
        map.addSource("route",  { type: "geojson", data: emptyFC() });
        map.addSource("me",     { type: "geojson", data: pt(home.lon, home.lat) });
        map.addSource("dest",   { type: "geojson", data: emptyFC() });
        map.addSource("alerts", { type: "geojson", data: emptyFC() });
        map.addSource("pstreets",   { type: "geojson", data: emptyFC() });
        map.addSource("pbuildings", { type: "geojson", data: emptyFC() });
        map.addSource("pcaution",   { type: "geojson", data: emptyFC() });
        map.addSource("pmeters",    { type: "geojson", data: emptyFC() });

        // Parking (drawn first, beneath route + pins)
        // Garage: outlined building footprint, colored by availability
        map.addLayer({ id: "pbuild-fill", type: "fill", source: "pbuildings",
          paint: { "fill-color": "#4F8EF7", "fill-opacity": 0.30 } });
        map.addLayer({ id: "pbuild-outline", type: "line", source: "pbuildings",
          paint: { "line-color": "#4F8EF7", "line-width": 3.5, "line-opacity": 1 } });
        // Street parking: colored line offset to the curb, colored by availability
        map.addLayer({ id: "pstreet-line", type: "line", source: "pstreets",
          layout: { "line-cap": "round" },
          paint: { "line-color": "#A78BFA", "line-width": 7, "line-offset": 4, "line-opacity": 1 } });
        // Real SF parking-meter locations as small dots (one "metered" color)
        map.addLayer({ id: "pmeter-dot", type: "circle", source: "pmeters",
          paint: { "circle-color": "#A78BFA",
                   "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, 1.5, 16, 3.5],
                   "circle-opacity": 0.9 } });

        // Route line: soft glow under a solid cyan line
        map.addLayer({ id: "route-glow", type: "line", source: "route",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "#00E5C7", "line-width": 10, "line-blur": 8, "line-opacity": 0.35 } });
        map.addLayer({ id: "route-core", type: "line", source: "route",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "#00E5C7", "line-width": 3, "line-opacity": 0.9 } });

        // Home dot + pulse
        map.addLayer({ id: "me-pulse", type: "circle", source: "me",
          paint: { "circle-color": "#00E5C7", "circle-radius": 8, "circle-opacity": 0.4 } });
        map.addLayer({ id: "me-core", type: "circle", source: "me",
          paint: { "circle-color": "#00E5C7", "circle-radius": 6, "circle-stroke-width": 2, "circle-stroke-color": "#0A0A0B" } });
        let t = 0;
        setInterval(() => { t = (t + 0.5) % 18;
          map.setPaintProperty("me-pulse", "circle-radius", 8 + t);
          map.setPaintProperty("me-pulse", "circle-opacity", 0.4 * (1 - t / 18));
        }, 60);

        // Destination marker (white, distinct from disruptions)
        map.addLayer({ id: "dest-core", type: "circle", source: "dest",
          paint: { "circle-color": "#FFFFFF", "circle-radius": 7, "circle-stroke-width": 3, "circle-stroke-color": "#00E5C7" } });

        // Current position during a simulated drive
        map.addSource("nav", { type: "geojson", data: emptyFC() });
        map.addLayer({ id: "nav-halo", type: "circle", source: "nav",
          paint: { "circle-color": "#00E5C7", "circle-radius": 12, "circle-opacity": 0.25 } });
        map.addLayer({ id: "nav-pos", type: "circle", source: "nav",
          paint: { "circle-color": "#00E5C7", "circle-radius": 7, "circle-stroke-width": 2, "circle-stroke-color": "#05221e" } });

        // Disruption pins (glow, core, label) — sit on top
        map.addLayer({ id: "alert-glow", type: "circle", source: "alerts",
          paint: { "circle-color": SEVERITY_COLOR, "circle-radius": zoomRadius(10, 20), "circle-blur": 1, "circle-opacity": 0.5 } });
        map.addLayer({ id: "alert-core", type: "circle", source: "alerts",
          paint: { "circle-color": SEVERITY_COLOR, "circle-radius": zoomRadius(5, 9), "circle-stroke-width": 2, "circle-stroke-color": "#0A0A0B" } });
        map.addLayer({ id: "alert-label", type: "symbol", source: "alerts",
          layout: { "text-field": ["get", "name"], "text-font": ["DIN Offc Pro Medium", "Arial Unicode MS Regular"],
                    "text-size": ["interpolate", ["linear"], ["zoom"], 10, 11, 15, 15], "text-offset": [0, 1.4],
                    "text-anchor": "top", "text-allow-overlap": false },
          paint: { "text-color": "#E8E8E8", "text-halo-color": "#0A0A0B", "text-halo-width": 1.5 } });

        // Break-in caution markers (on top): red dot with a "!"
        map.addLayer({ id: "pcaution-core", type: "circle", source: "pcaution",
          paint: { "circle-color": "#FF3B30", "circle-radius": zoomRadius(7, 11),
                   "circle-stroke-width": 2, "circle-stroke-color": "#fff" } });
        map.addLayer({ id: "pcaution-mark", type: "symbol", source: "pcaution",
          layout: { "text-field": "!", "text-font": ["DIN Offc Pro Medium", "Arial Unicode MS Regular"], "text-size": 14 },
          paint: { "text-color": "#fff" } });
        map.on("click", "pcaution-core", (e) => {
          new mapboxgl.Popup({ offset: 12 }).setLngLat(e.features[0].geometry.coordinates)
            .setHTML(`<strong>Break-in risk</strong><br>Elevated vehicle break-ins reported near here.`).addTo(map);
        });

        map.on("click", "alert-core", (e) => {
          const p = e.features[0].properties;
          new mapboxgl.Popup({ offset: 12 }).setLngLat(e.features[0].geometry.coordinates)
            .setHTML(`<strong>${p.name}</strong><br>${p.reason}`).addTo(map);
        });
        map.on("mouseenter", "alert-core", () => map.getCanvas().style.cursor = "pointer");
        map.on("mouseleave", "alert-core", () => map.getCanvas().style.cursor = "");

        renderQuick();
        renderSaved();
      });

      wireSearch();

      // Release the camera the instant the user touches the map during a trip,
      // so a single press grabs it (no fighting the per-frame camera update).
      const releaseOnTouch = () => {
        if (document.body.classList.contains("trip-mode")) setFollowing(false);
      };
      const canvas = map.getCanvas();
      canvas.addEventListener("mousedown", releaseOnTouch);
      canvas.addEventListener("touchstart", releaseOnTouch, { passive: true });
      canvas.addEventListener("wheel", releaseOnTouch, { passive: true });
    }

    // ---- Search: geocode as you type, pick a suggestion ----
    function wireSearch() {
      const input = document.getElementById("search-input");
      let timer = null;
      input.addEventListener("input", () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 3) { closeSuggestions(); return; }
        timer = setTimeout(() => geocode(q), 250);
      });
      input.addEventListener("keydown", (e) => {
        const items = document.querySelectorAll(".sugg-item");
        if (!items.length) return;
        if (e.key === "ArrowDown") { e.preventDefault(); suggIndex = Math.min(suggIndex + 1, items.length - 1); paintHi(items); }
        else if (e.key === "ArrowUp") { e.preventDefault(); suggIndex = Math.max(suggIndex - 1, 0); paintHi(items); }
        else if (e.key === "Enter" && suggIndex >= 0) { e.preventDefault(); items[suggIndex].click(); }
        else if (e.key === "Escape") { closeSuggestions(); }
      });
      document.addEventListener("click", (e) => {
        if (!document.getElementById("search-panel").contains(e.target)) closeSuggestions();
      });
    }

    async function geocode(q) {
      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json`
        + `?access_token=${TOKEN}&country=US&limit=5&bbox=${BAY_BBOX}&proximity=${BAY_PROX}`;
      try {
        const data = await (await fetch(url)).json();
        renderSuggestions(data.features || []);
      } catch { closeSuggestions(); }
    }

    function renderSuggestions(features) {
      const box = document.getElementById("suggestions");
      suggIndex = -1;
      if (!features.length) { closeSuggestions(); return; }
      box.innerHTML = features.map(f => {
        const [lon, lat] = f.center;
        const name = f.text;
        const sub = f.place_name.replace(f.text + ", ", "");
        return `<div class="sugg-item" onclick="pickDestination(${lon},${lat},'${escape(name)}')">
                  <div class="sugg-name">${name}</div><div class="sugg-sub">${sub}</div></div>`;
      }).join("");
      box.classList.add("open");
    }
    function paintHi(items) { items.forEach((el, i) => el.classList.toggle("hi", i === suggIndex)); }
    function closeSuggestions() { document.getElementById("suggestions").classList.remove("open"); suggIndex = -1; }

    function renderQuick() {
      document.getElementById("quick-row").innerHTML = QUICK.map(d =>
        `<div class="quick-chip" onclick="pickDestination(${d.lon},${d.lat},'${escape(d.name)}')">${d.name}</div>`
      ).join("");
    }

    // ---- Saved destinations (persisted in the browser via localStorage) ----
    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; }
      catch { return []; }
    }
    function persistSaved() { localStorage.setItem(SAVED_KEY, JSON.stringify(saved)); }
    function isSaved(name) { return saved.some(s => s.name === name); }

    function toggleSaveCurrent() {
      if (!currentDest) return;
      if (isSaved(currentDest.name)) saved = saved.filter(s => s.name !== currentDest.name);
      else saved.push({ ...currentDest });
      persistSaved(); renderSaved(); updateStar();
    }

    function removeSaved(nameEnc) {
      const name = unescape(nameEnc);
      saved = saved.filter(s => s.name !== name);
      persistSaved(); renderSaved(); updateStar();
    }

    function renderSaved() {
      const section = document.getElementById("saved-section");
      const row = document.getElementById("saved-row");
      if (!saved.length) { section.style.display = "none"; return; }
      section.style.display = "block";
      row.innerHTML = saved.map(s => `
        <div class="saved-chip">
          <span class="go" onclick="pickDestination(${s.lon},${s.lat},'${escape(s.name)}')">${s.name}</span>
          <span class="x" onclick="removeSaved('${escape(s.name)}')" title="Remove">&times;</span>
        </div>`).join("");
    }

    function updateStar() {
      const btn = document.getElementById("star-btn");
      const on = currentDest && isSaved(currentDest.name);
      btn.classList.toggle("on", !!on);
      btn.title = on ? "Remove from saved" : "Save destination";
    }

    // ---- Pick a destination: route to it, then find disruptions on the way ----
    async function pickDestination(lon, lat, nameEnc) {
      const name = unescape(nameEnc);
      document.getElementById("search-input").value = name;
      closeSuggestions();

      currentDest = { name, lon, lat };
      updateStar();
      document.body.classList.remove("trip-mode");  // picking a new place exits any active trip

      map.getSource("dest").setData(pt(lon, lat));

      // Real driving route from home -> destination
      const durl = `https://api.mapbox.com/directions/v5/mapbox/driving/`
        + `${home.lon},${home.lat};${lon},${lat}?geometries=geojson&overview=full&steps=true&access_token=${TOKEN}`;
      const dir = await (await fetch(durl)).json();
      if (!dir.routes || !dir.routes.length) return;
      const route = dir.routes[0];
      const line = route.geometry; // GeoJSON LineString

      map.getSource("route").setData({ type: "Feature", geometry: line, properties: {} });

      // Fit the map to the whole route
      const coords = line.coordinates;
      const b = coords.reduce((bb, c) => bb.extend(c), new mapboxgl.LngLatBounds(coords[0], coords[0]));
      lastRouteBounds = b;
      map.fitBounds(b, { padding: { top: 120, bottom: 160, left: 380, right: 360 }, duration: 900 });

      // Which disruptions fall near this route line?
      const turfLine = turf.lineString(coords);
      const onRoute = [];
      disruptions.forEach(d => {
        const km = turf.pointToLineDistance(turf.point([d.lon, d.lat]), turfLine, { units: "kilometers" });
        let severity = null;
        if (km <= NEAR_RED) severity = "red";
        else if (km <= NEAR_YELLOW) severity = "yellow";
        if (!severity) return;
        onRoute.push({ ...d, severity, km,
          reason: `${d.note} (${d.time} · ${km.toFixed(1)} km from route)` });
      });
      // Real civic/mobility events (SF 311) that fall near this route
      const civicOnRoute = await civicNearRoute(lon, lat, turfLine);
      onRoute.push(...civicOnRoute);
      onRoute.sort((a, b) => a.km - b.km);

      // Update pins
      map.getSource("alerts").setData({
        type: "FeatureCollection",
        features: onRoute.map(d => ({
          type: "Feature", geometry: pt(d.lon, d.lat),
          properties: { name: d.name, reason: d.reason, severity: d.severity },
        })),
      });

      updateSummary(name, route, onRoute);
      updateBell(onRoute);
      renderAlertList(onRoute);
      await loadParking(lon, lat);

      tripRoute = route; tripDisruptions = onRoute; tripName = name;
      loadBrief(name, route, onRoute);
    }

    // ---- AI trip brief (planning view) ----
    async function loadBrief(name, route, onRoute) {
      const brief = document.getElementById("brief");
      brief.classList.add("open");
      document.getElementById("brief-risk").className = "brief-risk";
      document.getElementById("brief-risk").textContent = "";
      document.getElementById("brief-src").textContent = "";
      document.getElementById("brief-headline").innerHTML = '<span class="brief-loading">Analyzing route…</span>';
      document.getElementById("brief-rec").textContent = "";

      const context = {
        destination: name,
        eta_min: Math.round(route.duration / 60),
        distance_mi: +(route.distance / 1609.34).toFixed(1),
        disruptions: onRoute.map(d => ({ name: d.name, severity: d.severity, reason: d.reason })),
        parking: currentZones.filter(z => z.type !== "garage").map(z => ({ name: z.name, count: z.count })),
      };
      try {
        const res = await fetch("/api/brief", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(context),
        });
        const data = await res.json();
        renderBrief(data.alert, data.source);
      } catch {
        brief.classList.remove("open");
      }
    }

    function renderBrief(a, source) {
      if (!a) return;
      const risk = (a.risk || "none").toLowerCase();
      const rEl = document.getElementById("brief-risk");
      rEl.className = "brief-risk " + risk;
      rEl.textContent = "Risk: " + risk;
      document.getElementById("brief-src").textContent = source === "ai" ? "◆ AI brief" : "◆ predicted";
      document.getElementById("brief-headline").textContent = a.headline || "";
      document.getElementById("brief-rec").innerHTML =
        a.recommendation && a.recommendation !== "No action needed"
          ? `<b>Do this:</b> ${a.recommendation}` : "No action needed.";
    }

    // ---- Parking (panel auto-shows; geometry renders on "Show on map") ----
    let currentZones = [];
    let currentDestPt = null;
    let parkingShown = false;
    let lastRouteBounds = null;
    let tripRoute = null, tripDisruptions = [], tripName = "";

    async function loadParking(lon, lat) {
      const data = await (await fetch(`/api/meters?lat=${lat}&lon=${lon}`)).json();
      currentZones = (data.streets || []).map(s => ({
        name: s.street, lat: s.lat, lon: s.lon, availability: s.availability,
        risk: s.risk, note: s.note, type: "street", count: s.count, meters: s.meters || [],
      }));
      currentDestPt = [lon, lat];

      // Clear the previous destination's curb lines / garages / caution
      map.getSource("pstreets").setData(emptyFC());
      map.getSource("pbuildings").setData(emptyFC());
      map.getSource("pcaution").setData(emptyFC());
      parkingShown = false;
      const btn = document.getElementById("pk-show");
      if (btn) btn.textContent = "Show on map ▸";

      // Meter dots are data-driven, so show them on the map right away — they
      // reveal where parking is as you drive toward the destination.
      const meterDots = [];
      currentZones.forEach(z => (z.meters || []).forEach(m =>
        meterDots.push({ type: "Feature", geometry: { type: "Point", coordinates: m }, properties: {} })));
      map.getSource("pmeters").setData({ type: "FeatureCollection", features: meterDots });

      renderParkingPanel(currentZones);
    }

    function toggleParkingView() {
      const btn = document.getElementById("pk-show");
      if (!parkingShown) {
        showParkingGeometry();
        btn.textContent = "‹ Back to route";
        parkingShown = true;
      } else {
        fitRoute();
        map.getSource("pstreets").setData(emptyFC());
        map.getSource("pbuildings").setData(emptyFC());
        map.getSource("pcaution").setData(emptyFC());
        btn.textContent = "Show on map ▸";
        parkingShown = false;
      }
    }

    function fitRoute() {
      if (lastRouteBounds) map.fitBounds(lastRouteBounds,
        { padding: { top: 120, bottom: 160, left: 380, right: 360 }, duration: 700 });
    }

    // ---- Committed trip view: step-through navigation ----
    let tripSteps = [], stepIndex = 0;

    function startTrip() {
      if (!tripRoute) return;
      document.body.classList.add("trip-mode");
      tripSteps = (tripRoute.legs && tripRoute.legs[0] && tripRoute.legs[0].steps) || [];
      stepIndex = 0;

      const mins = Math.round(tripRoute.duration / 60);
      const miles = (tripRoute.distance / 1609.34).toFixed(1);
      document.getElementById("trip-eta").textContent = `▶ ${mins} min`;
      document.getElementById("trip-dist").textContent = ` · ${miles} mi`;

      renderTripBody();
      prepDrive();
      progressKm = 0;
      gotoStep(0);
    }

    function endTrip() {
      stopDrive();
      setFollowing(true);
      document.body.classList.remove("trip-mode");
      map.getSource("nav").setData(emptyFC());
      map.easeTo({ pitch: 0, bearing: 0, duration: 600 });
      fitRoute();
    }

    function stepBy(d) { stopDrive(); gotoStep(stepIndex + d); }

    // Update just the instruction banner + list highlight for step i (no camera)
    function updateStepBanner(i) {
      stepIndex = i;
      const step = tripSteps[i];
      document.getElementById("nav-instruction").textContent = step.maneuver.instruction;
      const next = tripSteps[i + 1];
      let sub = next ? `Then in ${fmtDist(step.distance)}: ${next.maneuver.instruction}` :
                       "Arriving at your destination";
      const near = disruptionNearStep(step.maneuver.location);
      if (near) sub += ` · <span class="${near.severity === 'red' ? 'danger' : 'warn'}">⚠ ${near.name} ahead</span>`;
      document.getElementById("nav-sub").innerHTML = sub;

      document.getElementById("nav-prev").disabled = i === 0;
      document.getElementById("nav-next").disabled = i === tripSteps.length - 1;

      document.querySelectorAll(".step-item[data-step]").forEach(el =>
        el.classList.toggle("current", +el.dataset.step === i));
      const cur = document.querySelector(`.step-item[data-step="${i}"]`);
      if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    // Step mode: fly the camera to a maneuver, facing the direction of travel
    function gotoStep(i) {
      if (i < 0 || i >= tripSteps.length) return;
      const step = tripSteps[i];
      const loc = step.maneuver.location;
      curPos = loc; curBearing = step.maneuver.bearing_after ?? 0;
      setFollowing(true);   // a deliberate step re-centers the camera
      map.easeTo({ center: loc, zoom: 16.5, pitch: 60, bearing: curBearing, duration: 900 });
      map.getSource("nav").setData(pt(loc[0], loc[1]));
      updateStepBanner(i);
    }

    // ---- Auto-drive: continuous fly-through along the route geometry ----
    let driving = false, driveRAF = null, progressKm = 0, routeLineKm = 0, lastTs = 0;
    let stepCumKm = [];      // distance from start to each maneuver
    let smoothedBearing = null;  // eased camera heading, to avoid jitter
    let speedMult = 3;       // 1× / 2× / 3×
    let following = true;    // does the camera track the position?
    let recentering = false; // playing the smooth snap-back animation
    let curPos = null, curBearing = 0;  // latest position/heading, for re-center

    function setFollowing(v) {
      following = v;
      const btn = document.getElementById("recenter-btn");
      if (btn) btn.style.display = v ? "none" : "flex";
    }

    function recenter() {
      setFollowing(true);
      if (!curPos) return;
      // Let the eased animation play without the per-frame jumpTo cutting it off
      recentering = true;
      const dur = 900;
      map.easeTo({ center: curPos, zoom: 16.5, pitch: 60, bearing: curBearing, duration: dur, easing: t => t * (2 - t) });
      setTimeout(() => { recentering = false; }, dur);
    }
    const DRIVE_BASE_SEC = 60;  // a full route plays in ~60s at 1× (compressed sim, not real time)

    function prepDrive() {
      const coords = tripRoute.geometry.coordinates;
      routeLineKm = turf.length(turf.lineString(coords), { units: "kilometers" });
      // cumulative distance from start to each step's maneuver
      stepCumKm = [];
      let acc = 0;
      tripSteps.forEach((s, i) => { stepCumKm[i] = acc; acc += s.distance / 1000; });
    }

    function toggleDrive() { driving ? stopDrive() : startDrive(); }

    function startDrive() {
      if (!tripSteps.length) return;
      driving = true;
      document.getElementById("nav-drive").textContent = "⏸ Pause";
      document.getElementById("nav-drive").classList.remove("primary");
      if (progressKm >= routeLineKm) progressKm = 0;  // restart if at the end
      lastTs = 0; smoothedBearing = null;
      driveRAF = requestAnimationFrame(driveFrame);
    }

    function stopDrive() {
      driving = false;
      if (driveRAF) cancelAnimationFrame(driveRAF);
      const btn = document.getElementById("nav-drive");
      if (btn) { btn.textContent = "▶ Drive"; btn.classList.add("primary"); }
    }

    function driveFrame(ts) {
      if (!driving) return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000; lastTs = ts;

      progressKm += (routeLineKm / DRIVE_BASE_SEC) * speedMult * dt;
      if (progressKm >= routeLineKm) {
        progressKm = routeLineKm; drawDriveAt(progressKm);
        drawParkingGeometry();        // arrived: render curb lines + garages at destination
        stopDrive(); return;
      }
      drawDriveAt(progressKm);
      driveRAF = requestAnimationFrame(driveFrame);
    }

    const _driveLine = () => turf.lineString(tripRoute.geometry.coordinates);

    function drawDriveAt(km) {
      const line = _driveLine();
      const here = turf.along(line, km, { units: "kilometers" }).geometry.coordinates;
      // Longer look-ahead => steadier heading (less jitter)
      const ahead = turf.along(line, Math.min(km + 0.06, routeLineKm), { units: "kilometers" }).geometry.coordinates;
      const target = turf.bearing(turf.point(here), turf.point(ahead));

      // Ease the camera heading toward the target via the shortest angle
      if (smoothedBearing === null) smoothedBearing = target;
      else {
        const diff = ((target - smoothedBearing + 540) % 360) - 180;
        smoothedBearing += diff * 0.12;
      }

      curPos = here; curBearing = smoothedBearing;
      // Position dot always advances; the camera only follows if not panned away
      map.getSource("nav").setData(pt(here[0], here[1]));
      if (following && !recentering) map.jumpTo({ center: here, zoom: 16.5, pitch: 60, bearing: smoothedBearing });

      let i = 0;
      for (let k = 0; k < stepCumKm.length; k++) { if (stepCumKm[k] <= km + 0.0001) i = k; }
      if (i !== stepIndex) updateStepBanner(i);
    }

    function cycleSpeed() {
      speedMult = speedMult === 3 ? 1 : speedMult + 1;
      document.getElementById("nav-speed").textContent = `${speedMult}×`;
    }

    // Nearest on-route disruption to a step location, if close (<600m)
    function disruptionNearStep(loc) {
      let best = null, bestD = 0.6;
      tripDisruptions.forEach(d => {
        const km = turf.distance(turf.point(loc), turf.point([d.lon, d.lat]), { units: "kilometers" });
        if (km < bestD) { bestD = km; best = d; }
      });
      return best;
    }

    function renderTripBody() {
      let html = "";
      if (tripDisruptions.length) {
        html += `<span class="mono-label trip-sec-title">Heads up on the way</span>`;
        html += tripDisruptions.map(d => `
          <div class="alert-item"><div class="alert-dot ${d.severity}"></div>
          <div><div class="alert-name">${d.name}</div><div class="alert-reason">${d.reason}</div></div></div>`).join("");
      }
      html += `<span class="mono-label trip-sec-title">Directions</span>`;
      html += tripSteps.map((s, i) => `
        <div class="step-item" data-step="${i}" onclick="gotoStep(${i})" style="cursor:pointer">
          <div>${s.maneuver.instruction}</div><div class="step-dist">${fmtDist(s.distance)}</div></div>`).join("");

      const streets = currentZones.filter(z => z.type !== "garage");
      html += `<span class="mono-label trip-sec-title">Parking at destination</span>`;
      html += streets.length
        ? streets.map(z => `<div class="step-item"><div><span class="pk-badge metered">Metered</span> ${z.name}</div>
          <div class="step-dist">${z.count} spaces</div></div>`).join("")
        : `<div class="alert-empty">No metered parking data near here.</div>`;

      document.getElementById("trip-body").innerHTML = html;
    }

    function fmtDist(m) {
      return m < 300 ? `${Math.round(m / 0.3048 / 10) * 10} ft` : `${(m / 1609.34).toFixed(1)} mi`;
    }

    // Zoom to the destination, then draw real curbside lines + garage outlines.
    // Street/building geometry only exists at street-level zoom, so fly in first.
    function showParkingGeometry() {
      if (!currentDestPt || !currentZones.length) return;
      // Frame the destination AND all parking zones so every zone is on-screen
      // (queryRenderedFeatures only sees what's in view). Cap zoom so streets
      // and buildings still render.
      const pts = [currentDestPt, ...currentZones.map(z => [z.lon, z.lat])];
      const b = pts.reduce((bb, c) => bb.extend(c), new mapboxgl.LngLatBounds(pts[0], pts[0]));
      map.fitBounds(b, { padding: 140, maxZoom: 16.5, duration: 800 });
      map.once("idle", drawParkingGeometry);
      setTimeout(drawParkingGeometry, 1800); // backup if idle already fired
    }

    function drawParkingGeometry() {
      const streets = [], buildings = [], cautions = [], meterDots = [];
      const streetZones = currentZones;  // all real metered streets now

      streetZones.forEach(z => {
        // curbside line: snap the street's meter-centroid to the nearest real road
        const p = map.project([z.lon, z.lat]);
        const box = [[p.x - 90, p.y - 90], [p.x + 90, p.y + 90]];
        const road = nearestFeature(box, "road", [z.lon, z.lat], "line");
        if (road) { road.properties = { availability: z.availability }; streets.push(road); }
        // real meter locations as dots
        (z.meters || []).forEach(m => meterDots.push({
          type: "Feature", geometry: { type: "Point", coordinates: m },
          properties: { availability: z.availability },
        }));
        if (z.risk === "elevated") cautions.push({ type: "Feature", geometry: pt(z.lon, z.lat), properties: {} });
      });

      // Garages: real parking POIs from the map, building outlined
      const garages = findRealGarages();
      garages.forEach(g => { if (g.building) { g.building.properties = {}; buildings.push(g.building); } });

      map.getSource("pstreets").setData({ type: "FeatureCollection", features: streets });
      map.getSource("pmeters").setData({ type: "FeatureCollection", features: meterDots });
      map.getSource("pbuildings").setData({ type: "FeatureCollection", features: buildings });
      map.getSource("pcaution").setData({ type: "FeatureCollection", features: cautions });

      renderParkingPanel([...streetZones, ...garages.map(g => ({
        name: g.name, type: "garage", note: g.note, risk: "low",
      }))]);
    }

    function vectorSourceId() {
      const s = map.getStyle().sources;
      for (const id in s) { if (s[id].type === "vector" && String(s[id].url || "").includes("mapbox")) return id; }
      return "composite";
    }

    // Find real parking garages from the map's tile data (rendered or not)
    function findRealGarages() {
      let pl = [];
      try { pl = map.querySourceFeatures(vectorSourceId(), { sourceLayer: "poi_label" }); } catch {}
      const dest = turf.point(currentDestPt);
      const near = pl.filter(f => f.geometry.type === "Point" &&
        turf.distance(dest, turf.point(f.geometry.coordinates), { units: "kilometers" }) < 0.5);

      const parking = near.filter(f => {
        const c = String(f.properties.class || "").toLowerCase();
        const mk = String(f.properties.maki || "").toLowerCase();
        const ty = String(f.properties.type || "").toLowerCase();
        return mk === "parking" || c.includes("parking") || ty.includes("parking");
      });

      const seen = new Set(), out = [];
      parking.forEach(f => {
        const c = f.geometry.coordinates;
        const key = (f.properties.name || "") + c[0].toFixed(4) + c[1].toFixed(4);
        if (seen.has(key)) return; seen.add(key);
        const p = map.project(c);
        const bld = nearestFeature([[p.x - 45, p.y - 45], [p.x + 45, p.y + 45]], "building", c, "polygon");
        out.push({ name: f.properties.name || "Parking garage", lon: c[0], lat: c[1],
                   note: "Parking garage", building: bld });
      });
      return out;
    }

    // Nearest rendered road line / building polygon to a point (real Mapbox geometry)
    function nearestFeature(box, sourceLayer, near, kind) {
      let feats;
      try { feats = map.queryRenderedFeatures(box); } catch { return null; }
      feats = feats.filter(f => f.sourceLayer === sourceLayer);
      const target = turf.point(near);

      if (kind === "polygon") {
        const polys = feats.filter(f => f.geometry.type === "Polygon" || f.geometry.type === "MultiPolygon");
        for (const f of polys) {
          try { if (turf.booleanPointInPolygon(target, f)) return { type: "Feature", geometry: f.geometry, properties: {} }; } catch {}
        }
        let best = null, bestD = Infinity;
        polys.forEach(f => {
          try { const d = turf.distance(target, turf.centroid(f)); if (d < bestD) { bestD = d; best = { type: "Feature", geometry: f.geometry, properties: {} }; } } catch {}
        });
        return best;
      }

      let best = null, bestD = Infinity;
      feats.filter(f => f.geometry.type === "LineString" || f.geometry.type === "MultiLineString").forEach(f => {
        try {
          turf.flatten(f).features.forEach(seg => {
            if (seg.geometry.type !== "LineString") return;
            const d = turf.pointToLineDistance(target, seg, { units: "kilometers" });
            if (d < bestD) { bestD = d; best = { type: "Feature", geometry: seg.geometry, properties: {} }; }
          });
        } catch {}
      });
      return best;
    }

    function availLabel(a) { return a === "easy" ? "Open" : a === "moderate" ? "Tight" : "Full"; }

    function renderParkingPanel(zones) {
      document.getElementById("parking-panel").classList.add("open");
      const list = document.getElementById("parking-list");
      if (!zones.length) {
        list.innerHTML = '<div class="alert-empty">No metered parking data near here.</div>';
        return;
      }
      list.innerHTML = zones.map(z => {
        const badge = z.type === "garage"
          ? `<div class="pk-badge garage">Garage</div>`
          : `<div class="pk-badge metered">Metered</div>`;
        return `
        <div class="pk-item">
          ${badge}
          <div class="pk-body">
            <div class="pk-name">${z.name}${z.risk === "elevated" ? ' <span class="pk-caution">⚠ break-in risk</span>' : ''}</div>
            <div class="pk-sub">${z.note}</div>
            <div class="pk-meta">${z.type === "garage" ? "Garage" : (z.count ? z.count + " metered spaces" : "Street parking")}</div>
          </div>
        </div>`;
      }).join("");
    }

    function updateSummary(name, route, onRoute) {
      document.getElementById("route-summary").classList.add("open");
      document.getElementById("rs-dest").textContent = name;
      const mins = Math.round(route.duration / 60);
      const miles = (route.distance / 1609.34).toFixed(1);
      document.getElementById("rs-eta").innerHTML = `${mins}<small> min</small>`;
      document.getElementById("rs-dist").innerHTML = `${miles}<small> mi</small>`;
      const reds = onRoute.filter(d => d.severity === "red").length;
      const el = document.getElementById("rs-alerts");
      el.textContent = onRoute.length;
      el.className = "num" + (reds ? " danger" : onRoute.length ? " warn" : "");
    }

    function updateBell(onRoute) {
      const badge = document.getElementById("bell-badge");
      if (!onRoute.length) { badge.style.display = "none"; return; }
      badge.style.display = "flex";
      badge.textContent = onRoute.length;
      badge.style.background = onRoute.some(d => d.severity === "red") ? "var(--red)" : "var(--yellow)";
    }

    function renderAlertList(onRoute) {
      document.getElementById("alert-count").textContent = onRoute.length ? `${onRoute.length}` : "";
      const el = document.getElementById("alert-list");
      if (!onRoute.length) {
        el.innerHTML = '<div class="alert-empty">Nothing on this route. You\'re clear.</div>';
        return;
      }
      el.innerHTML = onRoute.map(d => `
        <div class="alert-item">
          <div class="alert-dot ${d.severity}"></div>
          <div><div class="alert-name">${d.name}</div><div class="alert-reason">${d.reason}</div></div>
        </div>`).join("");
    }

    function toggleAlerts() { document.getElementById("alert-panel").classList.toggle("open"); }

    // ---- Civic/mobility events (SF 311) — the shared "what's happening" source ----
    let lastCivic = [];  // cache of the most recent fetch, reused by the feed

    async function fetchCivic(lon, lat, radius = 1500) {
      try {
        const res = await fetch(`/api/civic?lat=${lat}&lon=${lon}&radius=${radius}`);
        const data = await res.json();
        lastCivic = data.events || [];
      } catch { lastCivic = []; }
      return lastCivic;
    }

    // View 1: civic events that fall near the route line -> disruption shape
    async function civicNearRoute(destLon, destLat, turfLine) {
      const events = await fetchCivic(destLon, destLat, 1800);
      const out = [];
      events.forEach(e => {
        const km = turf.pointToLineDistance(turf.point([e.lon, e.lat]), turfLine, { units: "kilometers" });
        if (km > NEAR_YELLOW) return;
        const severity = (e.severity === "red" && km <= NEAR_RED) ? "red" : "yellow";
        out.push({
          name: `${e.icon} ${e.name}`, lat: e.lat, lon: e.lon, severity, km,
          reason: `${e.category}${e.detail ? " — " + e.detail : ""} · ${e.status} · reported ${e.time} (${km.toFixed(1)} km from route)`,
        });
      });
      return out;
    }

    const EVENT_ICON = {
      concert: "🎵", event: "🎫", protest: "📢", market: "🛒",
      construction: "🚧", incident: "🚗", weather: "🌊",
    };

    // View 2: the Area Feed — major events + drive-affecting closures near a place
    async function toggleFeed() {
      const panel = document.getElementById("feed-panel");
      const opening = !panel.classList.contains("open");
      panel.classList.remove("open");
      document.getElementById("alert-panel").classList.remove("open");
      if (!opening) return;
      panel.classList.add("open");

      const focus = currentDestPt || [home.lon, home.lat];
      const label = currentDest ? currentDest.name : home.label;
      document.getElementById("feed-place").textContent = `Near ${label}`;
      document.getElementById("feed-list").innerHTML = '<div class="alert-empty">Loading…</div>';

      // Major events (mock pool) within ~3km of the focus point
      const here = turf.point(focus);
      const items = [];
      disruptions.forEach(d => {
        const km = turf.distance(here, turf.point([d.lon, d.lat]), { units: "kilometers" });
        if (km > 3) return;
        items.push({
          icon: EVENT_ICON[d.type] || "•", title: d.name,
          meta: `${d.time} · ${km.toFixed(1)} km away`, sub: d.note,
          severity: ["incident", "construction", "weather"].includes(d.type) ? "red" : "yellow",
          km,
        });
      });
      // Real, active road/sidewalk closures (SF 311) near the focus — nearest few
      const closures = await fetchCivic(focus[0], focus[1], 1500);
      closures.map(c => ({ c, km: turf.distance(here, turf.point([c.lon, c.lat]), { units: "kilometers" }) }))
        .sort((a, b) => a.km - b.km)
        .slice(0, 6)
        .forEach(({ c, km }) => items.push({
          icon: c.icon, title: c.name, meta: `reported ${c.time} · ${km.toFixed(1)} km away`,
          sub: c.address, severity: c.severity, km,
        }));

      items.sort((a, b) => a.km - b.km);
      renderFeed(items);
    }

    function renderFeed(items) {
      const el = document.getElementById("feed-list");
      if (!items.length) {
        el.innerHTML = '<div class="alert-empty">Nothing major happening nearby.</div>';
        return;
      }
      el.innerHTML = items.map(e => `
        <div class="feed-item">
          <div class="feed-icon">${e.icon}</div>
          <div>
            <div class="feed-name">${e.title}<span class="sev ${e.severity}"></span></div>
            <div class="feed-meta">${e.meta}</div>
            ${e.sub ? `<div class="feed-addr">${e.sub}</div>` : ""}
          </div>
        </div>`).join("");
    }

    function pt(lon, lat) { return { type: "Point", coordinates: [lon, lat] }; }
    function emptyFC() { return { type: "FeatureCollection", features: [] }; }
  </script>
</body>
</html>
