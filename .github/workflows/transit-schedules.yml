# Keep the transit schedules current.
#
# About forty Bay Area agencies publish timetables through 511, each on its
# own schedule. Each night this asks 511 which feeds changed (one request),
# downloads and rebuilds only those (usually none), and commits only their
# files — so a new Muni timetable is a Muni-sized commit, and the push
# redeploys Render. The build is byte-for-byte reproducible, so an unchanged
# feed is never a diff.
#
# A red run means one of:
#   - a major agency (Muni, BART, Caltrain, AC Transit, SamTrans, VTA, Golden
#     Gate) failed to download or build — smaller ones are warnings
#   - the check failed: a major agency missing, a known trip no longer
#     planning, or a major agency within 14 days of running out
# In every case the previous, committed schedules stay live.
#
# Setup: add TRAFFIC_511_TOKEN as a repository secret (Settings -> Secrets
# and variables -> Actions), the same value as in .env and on Render. The
# token never appears in this job's output.
name: Transit schedules

on:
  schedule:
    - cron: "41 10 * * *"     # 10:41 UTC = 3:41 AM Pacific, off the top of the hour
  workflow_dispatch:           # also runnable by hand from the Actions tab

permissions:
  contents: write              # to commit refreshed schedules

concurrency:
  group: transit-schedules
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests python-dateutil

      - name: Rebuild what 511 changed
        id: build
        env:
          TRAFFIC_511_TOKEN: ${{ secrets.TRAFFIC_511_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_511_TOKEN" ]; then
            echo "::error::TRAFFIC_511_TOKEN repository secret is not set"
            exit 1
          fi
          python gtfs_build.py

      - name: Check the result
        run: python gtfs_build.py --check

      - name: Commit if the schedules changed
        env:
          SUMMARY: ${{ steps.build.outputs.summary }}
        run: |
          # status, not diff: a newly added agency is an untracked file,
          # which diff would not see.
          if [ -z "$(git status --porcelain -- transit_data)" ]; then
            echo "No new schedules published."
            exit 0
          fi
          git config user.name "transit-schedules bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A transit_data
          git commit -m "Refresh transit schedules" -m "$SUMMARY"
          git push
