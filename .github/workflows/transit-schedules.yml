# Keep the transit schedules current.
#
# Muni, BART and Caltrain publish new timetables every few months through 511.
# Each night this rebuilds transit_data/ from the latest feeds. The build is
# byte-for-byte reproducible, so an unchanged feed produces no diff and no
# commit; a new timetable produces a commit, and that push redeploys Render.
#
# A red run means one of:
#   - the download or build failed (511 down, token rejected)
#   - the result failed its check: an agency missing, a known trip no longer
#     planning, or schedules within 14 days of expiring with nothing newer
# In every case the previous, committed schedules stay live.
#
# Setup: add TRAFFIC_511_TOKEN as a repository secret (Settings -> Secrets
# and variables -> Actions), the same value as in .env and on Render. Three
# requests a night, well inside 511's 60-per-hour limit.
name: Transit schedules

on:
  schedule:
    - cron: "41 10 * * *"     # 10:41 UTC = 3:41 AM Pacific, off the top of the hour
  workflow_dispatch:           # also runnable by hand from the Actions tab

permissions:
  contents: write              # to commit refreshed schedules

concurrency:
  group: transit-schedules
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests python-dateutil

      - name: Rebuild from 511
        env:
          TRAFFIC_511_TOKEN: ${{ secrets.TRAFFIC_511_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_511_TOKEN" ]; then
            echo "::error::TRAFFIC_511_TOKEN repository secret is not set"
            exit 1
          fi
          python gtfs_build.py

      - name: Check the result
        run: python gtfs_build.py --check

      - name: Commit if the schedules changed
        run: |
          if git diff --quiet -- transit_data; then
            echo "No new schedules published."
            exit 0
          fi
          versions=$(python -c "import json; print(', '.join(f\"{f['agency']} {f['version']} (to {f['end']})\" for f in json.load(open('transit_data/feeds.json'))))")
          git config user.name "transit-schedules bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transit_data
          git commit -m "Refresh transit schedules" -m "$versions"
          git push
