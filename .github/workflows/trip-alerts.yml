# Backup for the clock.
#
# The clock is an outside scheduler (cron-job.org) calling POST /api/tick
# every 10 minutes; each tick sends whatever alerts are due. This nightly run
# calls the same endpoint, so if that scheduler ever stops, the evening-before
# alerts still go out. Calling it twice is harmless: each alert is sent once.
#
# GitHub Actions cron alone wasn't enough: runs start late (the first ones
# six and a half hours late), are sometimes skipped, and are auto-disabled
# after 60 days with no repository activity.
#
# Setup: two repository secrets (Settings -> Secrets and variables ->
# Actions): APP_URL, e.g. https://bay-area-predictive-gps.onrender.com, and
# CRON_SECRET, matching the env var of the same name on Render.
name: Trip alerts

on:
  schedule:
    # 04:23 UTC = 21:23 PDT / 20:23 PST: after 8 PM Pacific all year, when the
    # evening-before alerts fall due. Off the top of the hour, GitHub's busiest.
    - cron: "23 4 * * *"
  workflow_dispatch:          # also runnable by hand from the Actions tab

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        # A free Render service spins down after 15 minutes idle and takes
        # about a minute to wake, so the first request is given room to fail.
        continue-on-error: true
        run: curl -fsS --max-time 180 "${{ secrets.APP_URL }}/api/health" || true

      - name: Send due alerts
        # The reply is counts only. Fail the run if an alert did not deliver,
        # so it shows red in the Actions tab.
        run: |
          response=$(curl -fsS --max-time 300 --retry 3 --retry-delay 20 \
            -X POST "${{ secrets.APP_URL }}/api/tick" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          echo "$response" | jq -c '{sent, failed, waiting, calendar_synced}'
          failed=$(echo "$response" | jq '.failed')
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed alert(s) were not delivered. Use the Test button in the Schedule panel to see why."
            exit 1
          fi
